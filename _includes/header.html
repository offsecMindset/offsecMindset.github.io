<header>
  <div style="display:flex; flex-direction: row; justify-content: space-between; padding: -200px">
    <p align="left">
  <img src="/assets/profile.jpg" 
       alt="My profile"
       style="border-radius: 50%; width: 50px; height: 50px; object-fit: cover;" />
</p>
  <div style="text-align: center; width:100%; align-self:center">

    <a href="{{ "/" | prepend: site.baseurl | replace: '//', '/' }}">
    {% assign owner_first_name = site.owner | split: " " %}
    <h1>{{ owner_first_name[0] | downcase }}@home:~$</h1>
    </a>
    <div class="header-links">
      {% include links.html %}
    </div>
  </div>
  </div>
</header>
